* { box-sizing: border-box; }
html { font-size: 100%; }
body { margin: 0; color: rgb(var(--gm-text)); background: rgb(var(--gm-canvas)); font: var(--gm-font-size-body)/var(--gm-line-height-body) var(--gm-font-family); }
button, input, textarea, select { font: inherit; }
button, [role="button"], input, select { touch-action: manipulation; }
:focus-visible { outline: var(--gm-border-width-focus) solid rgb(var(--gm-focus)); outline-offset: var(--gm-focus-offset); }
a { color: rgb(var(--gm-info-fg)); text-underline-offset: 3px; }
.gm-link { text-decoration: underline; }
.gm-muted, .gm-neutral-update { color: rgb(var(--gm-text-muted)); }
.gm-card { padding: var(--gm-space-4); background: rgb(var(--gm-surface)); color: rgb(var(--gm-text)); border: 1px solid rgb(var(--gm-border)); border-radius: var(--gm-radius-card); box-shadow: var(--gm-shadow-card); }

.gm-btn--primary { background: rgb(var(--gm-brand-solid)); color: rgb(var(--gm-on-brand)); }
.gm-btn--primary:hover { background: rgb(var(--gm-brand-hover)); }
.gm-btn--primary:active { background: rgb(var(--gm-brand-active)); }
.gm-btn--secondary { background: rgb(var(--gm-surface)); color: rgb(var(--gm-text)); border-color: rgb(var(--gm-control-border)); }
.gm-btn--secondary:hover { background: rgb(var(--gm-surface-muted)); }
.gm-btn--secondary:active { background: rgb(var(--gm-canvas)); }
.gm-btn--danger { background: rgb(var(--gm-danger-solid)); color: rgb(var(--gm-on-danger)); }

 if(r.status==='waiting'&&next!=='waiting')closeWaiting(r);
 r.status=next;r.last_updated_at=state.now;r.public_updated_at=state.now;
 if(next==='in_progress'){r.assignee_id=r.assignee_id||state.userId;r.completed_at=null;r.closed_at=null;r.auto_close_due_at=null;r.cancelled_at=null}
 if(next==='completed'){r.completed_at=state.now;r.closed_at=r.type==='gm_task'||!r.requester_id?state.now:null;r.auto_close_due_at=r.closed_at?null:addBusiness(state.now,3);unpin(r)}
 if(next==='cancelled'){r.cancelled_at=state.now;r.cancel_reason=note;r.auto_close_due_at=null;unpin(r)}
 event(r,'status_changed',`เปลี่ยนเป็น${STATUS[next]}`,note);
 notify(r,recipients(r),STATUS[next]);return true;
}
function followUp(r,remind=false){if(!isGM()||r.status!=='waiting')return;const p=currentPeriod(r);if(remind&&p?.notify_ids.length){if(r.reminded_at&&workKey(r.reminded_at)===workKey(state.now)){toast('ส่งเตือนไปแล้วในวันทำการนี้');return false}r.reminded_at=state.now;notify(r,p.notify_ids,'ทีม GM ขออัปเดตเรื่องที่รอ');event(r,'reminded','ส่งเตือนอีกครั้ง');r.history.at(-1).reminded_at=state.now}event(r,'followed_up','ติดตามแล้ว','',state.userId,true);toast(remind?'ติดตามแล้ว · บันทึกการส่งเตือนจำลองแล้ว':'บันทึก “ติดตามแล้ว”');render();return true}
function respond(r,note='',actor=state.userId){const p=currentPeriod(r);if(r.status!=='waiting'||!p||p.responded_at||!p.notify_ids.includes(actor)||!['person','team'].includes(p.waiting_on.kind))return false;p.responded_at=state.now;event(r,'waiting_party_responded','ฝ่ายที่รอตอบกลับว่าเรียบร้อยแล้ว',note,actor,false);r.history.at(-1).responded_at=state.now;notify(r,[r.assignee_id].filter(Boolean),'ฝ่ายที่รอตอบกลับแล้ว');return true}
function watcher(r,id,note='',photos=[]){if(r.is_confidential||!isOpen(r)||r.type!=='maintenance'||r.symptom==='อื่นๆ')return false;if(r.requester_id===id){toast('คุณเป็นผู้ขอของงานนี้อยู่แล้ว');return false}if(r.watcher_ids.includes(id)){toast('คุณติดตามงานนี้อยู่แล้ว');return false}r.watcher_ids.push(id);r.public_updated_at=state.now;event(r,'watcher_added','มีผู้แจ้งเพิ่ม',note,id,false);r.history.at(-1).photos=photos;r.history.at(-1).event_id=`watch-${r.id}-${id}`;state.reads[`${id}:${r.id}`]=state.now;return true}
function processSchedules(){for(const r of state.requests){if(r.status==='completed'&&!r.closed_at&&r.auto_close_due_at&&state.now>=r.auto_close_due_at){r.closed_at=r.auto_close_due_at;event(r,'auto_closed','ปิดอัตโนมัติเมื่อครบ 3 วันทำการ','',null);r.history.at(-1).at=r.closed_at;r.public_updated_at=state.now;unpin(r);notify(r,recipients(r),'ปิดงานแล้ว')}}for(const p of Object.values(state.profiles)){const leaveValid=p.presence_status==='ลา'&&p.leave_end&&localDate(state.now)<=p.leave_end;if(!leaveValid&&localDate(p.presence_updated_at)!==localDate(state.now)){p.presence_status='ไม่ระบุ';p.presence_updated_at=state.now;p.leave_end=null}}}

function boardWindow(r){if(isOpen(r))return true;if(r.status==='completed'&&!r.closed_at)return true;const t=r.status==='cancelled'?r.cancelled_at:r.closed_at;return t&&t>=state.now-7*DAY}

function gmCreateView(){if(!isGM())return empty('เฉพาะทีม GM');return `${heading('เริ่มงานของ GM','งานข้ามทีมใช้ฟอร์มเดียวกัน · ไม่ต้องมีผู้ขอ',btn('เปิดแทนผู้ขอ','on-behalf','','','users'))}<div class="form-wrap"><form id="gm-create-form" class="panel"><div class="field"><label for="gm-title">ชื่อบนบอร์ด *</label><input id="gm-title" name="summary_title" class="gm-input" required maxlength="140" placeholder="เช่น จัดซื้ออุปกรณ์สำนักงาน — ทีมบัญชี"><small>ใช้ชื่อกลางๆ ไม่ใส่เลขเอกสารหรือข้อมูลส่วนบุคคล</small></div><div class="form-grid"><div class="field"><label for="gm-category">หมวดงาน *</label><select id="gm-category" name="category" class="gm-input">${options(CATEGORIES,CATEGORIES[3])}</select></div><div class="field"><label for="gm-location">สถานที่</label><select id="gm-location" name="location" class="gm-input">${options(['',...LOCATIONS],'','ไม่ระบุ')}</select></div><div class="field"><label for="gm-status">สถานะเริ่มต้น</label><select id="gm-status" name="status" class="gm-input"><option value="queued">รอคิว</option><option value="in_progress">กำลังทำ</option><option value="waiting">รอผู้อื่น</option></select></div><div class="field"><label for="gm-sensitivity">ลักษณะเรื่อง</label><select id="gm-sensitivity" name="sensitivity_reason" class="gm-input"><option value="">ทั่วไป</option><option value="contract">เรื่องสัญญา</option><option value="personnel">เรื่องบุคคล</option></select></div></div><div class="field"><span>ผู้เกี่ยวข้องรายบุคคล</span><label class="check-row"><input type="checkbox" name="related_person_ids" value="account">นิดา · ทีมบัญชี</label><label class="check-row"><input type="checkbox" name="related_person_ids" value="warehouse">ต้นกล้า · ทีมคลัง</label><small>เฉพาะคนที่เลือกได้รับสิทธิ์รายละเอียด ทีมใช้เป็น label รายงาน</small></div><label class="check-row"><input type="checkbox" id="gm-private" name="is_confidential">งานลับ — ไม่แสดงบนบอร์ดสรุป</label><div id="gm-wait-fields" hidden>${waitingFields('gm')}</div><div class="field"><label fo function periodStart(kind){const t=new Date(state.now+TZ),y=t.getUTCFullYear(),m=t.getUTCMonth();if(kind==='week'){const start=dayStart(state.now);return start-((t.getUTCDay()+6)%7)*DAY}return Date.UTC(y,kind==='quarter'?Math.floor(m/3)*3:m,1)-TZ}
function dashboardData(){const f=state.dashFilters,start=periodStart(f.period),allowed=state.requests.filter(r=>canSummary(r)&&(!f.location||r.location===f.location)&&(!f.assignee||r.assignee_id===f.assignee)&&(!f.type||r.type===f.type));const cohort=allowed.filter(r=>r.created_at>=start&&r.created_at<=state.now);const counts=Object.fromEntries(Object.keys(STATUS).map(s=>[s,cohort.filter(r=>r.status===s).length]));const eligible=cohort.filter(r=>r.sla_snapshot&&((r.sla_snapshot.milestone_type==='coordinate'?r.coordinated_at:r.completed_at)||activeBudgetUsed(r)>r.sla_snapshot.duration*DAY));const passed=eligible.filter(r=>{const done=r.sla_snapshot.milestone_type==='coordinate'?r.coordinated_at:r.completed_at;return done&&activeBudgetUsed(r)<=r.sla_snapshot.duration*DAY});const waitingMap=new Map();for(const r of allowed){for(const p of r.waiting_periods){const end=Math.min(state.now,activeWaitEnd(p)),from=Math.max(start,p.started_at);if(end<=from)continue;const label=waitingName(p.waiting_on);const bucket=waitingMap.get(label)||{label,ids:new Set(),ms:0,business_ms:0};bucket.ids.add(r.id);bucket.ms+=end-from;bucket.business_ms+=businessMs(from,end);waitingMap.set(label,bucket)}}return {start,allowed,cohort,counts,eligible,passed,waits:[...waitingMap.values()].sort((a,b)=>b.ids.size-a.ids.size||b.ms-a.ms)}}
function donut(counts){const total=Object.values(counts).reduce((a,b)=>a+b,0);if(!total)return empty('ยังไม่มีงานในช่วงนี้');let angle=-Math.PI/2;function point(a,r){return[110+Math.cos(a)*r,110+Math.sin(a)*r]}const paths=Object.entries(counts).filter(([,n])=>n).map(([s,n])=>{const span=Math.min(n/total*Math.PI*2,Math.PI*2-.00001),end=angle+span,[x1,y1]=point(angle,88),[x2,y2]=point(end,88),[x3,y3]=point(end,60),[x4,y4]=point(angle,60);const path=`M${x1} ${y1} A88 88 0 ${span>Math.PI?1:0} 1 ${x2} ${y2} L${x3} ${y3} A60 60 0 ${span>Math.PI?1:0} 0 ${x4} ${y4}Z`;angle=end;return `<path d="${path}" fill="${STATUS_COLORS[s]}" stroke="#2D2A26" stroke-width="2"><title>${STATUS[s]} ${n} งาน</title></path>`}).join('');return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="สถานะงานทั้งหมด ${total} งาน"><defs><mask id="donut-mask"><circle cx="110" cy="110" r="70" stroke="white" stroke-width="80" fill="none" transform="rotate(-90 110 110)" class="ring-reveal"/></mask></defs><g mask="url(#donut-mask)">${paths}</g><text x="110" y="109" text-anchor="middle" font-size="36" font-weight="600">${total}</text><text x="110" y="135" text-anchor="middle" font-size="14">งานทั้งหมด</text></svg>`}
function stackedBar(rows,max){let x=0;return `<svg viewBox="0 0 240 24" role="img" aria-label="${E(Object.entries(rows).map(([s,n])=>`${STATUS[s]} ${n}`).join(', '))}"><rect x="0" y="2" width="240" height="20" rx="5" fill="#F2F1EA"/>${Object.entries(rows).filter(([,n])=>n).map(([s,n])=>{const w=n/Math.max(1,max)*238;const out=`<rect x="${x+1}" y="3" width="${Math.max(1,w)}" height="18" rx="2" fill="${STATUS_COLORS[s]}" stroke="#2D2A26" stroke-width="1.5"/>`;x+=w;return out}).join('')}</svg>`}

function updateWaitingFields(prefix){

 const active=prefix==='wait'||document.getElementById('gm-status').value==='waiting',kind=kindNode.value;

 kindNode.disabled=!active;kindNode.required=active;
 node('person-wrap').hidden=kind!=='person';person.disabled=!active||kind!=='person';person.required=active&&kind==='person';
 node('name-wrap').hidden=!kind||kind==='person';name.disabled=!active||!kind||kind==='person';name.required=active&&!!kind&&kind!=='person';
 node('contacts').hidden=kind!=='team';node('contacts').querySelectorAll('input').forEach(el=>el.disabled=!active||kind!=='team');
 const contacts=[...node('contacts').querySelectorAll('input:checked')].map(x=>x.value);
 const ids=kind==='person'&&person.value?[person.value]:kind==='team'?contacts:[];
 const recipientKey=ids.join(',');
 if(notifyBox.dataset.recipients!==recipientKey){notifyBox.checked=!!ids.length;consent.checked=false;notifyBox.dataset.recipients=recipientKey}
 node('notify-wrap').hidden=!active||!ids.length;notifyBox.disabled=!active||!ids.length;
 const send=active&&!!ids.length&&notifyBox.checked;
 const preview=node('related-preview');preview.hidden=!send;preview.textContent=send?`เพิ่มสิทธิ์รายละเอียดให้: ${ids.map(nameOf).join(', ')}`:'';
 const confidential=prefix==='gm'?document.getElementById('gm-private').checked:get(modalContext?.id)?.is_confidential;
 node('private-confirm').hidden=!(confidential&&send);consent.disabled=!(confidential&&send);consent.required=!!(confidential&&send);
 const filled=!!kind&&(kind==='person'?!!person.value:!!name.value.trim());
 const valid=(!active||filled&&(!confidential||!send||consent.checked))&&(prefix!=='gm'||!!document.getElementById('gm-title').value.trim());

 document.querySelectorAll('button[type="submit"]').forEach(button=>{if(button.form?.id===formId)button.disabled=!valid});

document.addEventListener('change',e=>{const el=e.target;if(el.id==='demo-role'){state.userId=el.value;if((state.route==='gmcreate'&&!isGM())||(state.route==='dashboard'&&!isGM()&&user().role!=='viewer'))state.route='home';if(state.route==='detail'&&!canSummary(get(state.detailId)))state.route='board';if(state.route==='repair'){state.repair=newRepair()}state.tab=state.userId==='account'?'related':'mine';render();demoPanel();return}if(el.id.startsWith('board-')&&el.id!=='board-search'){state.boardFilters[el.id.slice(6)]=el.value;render();return}if(el.id.startsWith('dash-')){state.dashFilters[el.id.slice(5)]=el.value;render();return}if(el.id==='onbehalf-person'){state.repair.requester_id=el.value==='free'?null:el.value;render();return}if(el.id==='photo-input'){const arr=photoTarget();[...el.files].forEach(f=>preparePhoto(f,arr));el.value='';return}if(el.id==='gm-status'){document.getElementById('gm-wait-fields').hidden=el.value!=='waiting';updateWaitingFields('gm');return}if(el.id==='gm-sensitivity'){const box=document.getElementById('gm-private');box.checked=!!el.value;box.disabled=!!el.value;updateWaitingFields('gm');return}if(el.id==='gm-private'){updateWaitingFields('gm');return}if(el.id==='presence-select'){document.getElementById('leave-end-wrap').hidden=el.value!=='ลา';return}if(el.id==='wait-kind'){clearWaitingChoice('wait');return}if(el.id==='gm-kind'){clearWaitingChoice('gm');return}if(el.closest('#wait-form'))updateWaitingFields('wait');if(el.closest('#gm-wait-fields'))updateWaitingFields('gm')});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;state.now+=1000;
 if(form.id==='board-filter-form'){const f=new FormData(form);state.boardFilters=Object.fromEntries(['location','assignee','type','search'].map(k=>[k,String(f.get(k)||'').trim()]));closeModal();render();window.scrollTo(0,0);return}
 if(form.id==='wait-form'){try{const r=get(modalContext.id),w=readWaiting(form,'wait',r.is_confidential);if(!isGM()||!isOpen(r))throw new Error('สถานะงานเปลี่ยนไปแล้ว');applyWaiting(r,w);closeModal();render();toast(w.notify_ids.length?'บันทึกรอผู้อื่น · แจ้งและเพิ่มสิทธิ์ผู้รับแล้ว (จำลอง)':'บันทึกรอผู้อื่นแล้ว')}catch(err){const el=document.getElementById('wait-error');el.hidden=false;el.textContent=err.message}return}
 if(form.id==='gm-create-form'){if(!isGM())return;const f=new FormData(form),title=String(f.get('summary_title')||'').trim();const sensitivity=String(f.get('sensitivity_reason')||''),priv=f.has('is_confidential')||!!sensitivity;try{if(!title)throw new Error('กรุณาตั้งชื่อบนบอร์ด');const status=f.get('status'),wait=status==='waiting'?readWaiting(form,'gm',priv):null;const r=newRequest({type:'gm_task',origin:'gm_initiated',created_by_id:state.userId,assignee_id:state.userId,summary_title:title,category:f.get('category'),location:f.get('location')||null,status:status==='waiting'?'queued':status,related_person_ids:f.getAll('related_person_ids'),is_confidential:priv,sensitivity_reason:sensitivity||null,description:String(f.get('description')||'')});if(wait)applyWaiting(r,wait);toast(`สร้าง ${r.request_number} แล้ว`);routeTo('detail',r.id)}catch(err){const el=document.getElementById('gm-error');el.hidden=false;el.textContent=err.message}return}
 if(form.id==='comment-form'){const r=get(form.dataset.id),text=document.getElementById('comment-text').value.trim();if(r&&canDetail(r)&&text){r.comments.push({text,actor_id:state.userId,at:state.now});event(r,'commented','เพิ่มคอมเมนต์',text,state.userId,isGM());render();toast('บันทึกคอมเมนต์แล้ว')}return}
 if(form.id==='reason-form'){const text=document.getElementById('reason-text').value.trim();if(!text)return;const r=get(modalContext.id),kind=modalContext.kind;if(kind==='request-reopen'){if(r.requester_id!==state.userId||r.status!=='completed'||r.closed_at)return;r.status='in_progress';r.completed_at=null;r.auto_close_due_at=null;r.public_updated_at=state.now;event(r,'requester_reopened','ผู้ขอแจ้งว่ายังไม่เรียบร้อย',text);notify(r,[r.assignee_id],'ผู้ขอแจ้งว่ายังไม่เรียบร้อย')}else{changeStatus(r,kind==='cancel'?'cancelled':'in_progress',text);if(kind==='reopen')event(r,'reopened','เปิดงานกลับ',text)}closeModal();render();toast(kind==='cancel'?'ยกเลิกงานแล้ว':'เปิดงานกลับแล้ว');return}
 if(form.id==='presence-form'){const p=state.profiles[state.userId],status=document.getElementById('presence-select').value,end=document.getElementById('leave-end').value;if(status==='ลา'&&(!end||end<localDate(state.now))){toast('เลือกวันสิ้นสุดการลาตั้งแต่วันนี้');return}p.presence_status=status;p.presence_updated_at=state.now;p.leave_end=status==='ลา'?end:null;closeModal();render();toast('อัปเดตสถานะแล้ว');return}
});
document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-card]');if(!card||!isGM()||innerWidth<1024)return;dragId=card.dataset.card;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const col=e.target.closest('[data-column],[data-compact]');if(col&&dragId&&isGM()){e.preventDefault();col.classList.add('drag-over')}});
document.addEventListener('dragleave',e=>{e.target.closest('[data-column],[data-compact]')?.classList.remove('drag-over')});
document.addEventListener('drop',e=>{const col=e.target.closest('[data-column],[data-compact]');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(!col||!dragId||!isGM())return;e.preventDefault();const r=get(dragId),next=col.dataset.column||col.dataset.compact;dragId=null;if(r.status===next)return;if(next==='waiting'){openWait(r);return}if(['completed','cancelled'].includes(next)){if(next==='completed')modal('งานเรียบร้อยแล้ว?',`<p>${r.request_number} · ${E(r.summary_title)}</p><div class="field"><label for="complete-note">สรุปงาน (ไม่บังคับ)</label><textarea class="gm-input" id="complete-note" maxlength="1000"></textarea></div>`,btn('กลับไปดูงาน','close-dialog')+btn('ยืนยันเสร็จ','complete-confirm',r.id,'primary','check'),{kind:'complete',id:r.id});if(next==='cancelled')modal('ยกเลิกงาน',`<form id="reason-form"><div class="field"><label for="reason-text">เหตุผล *</label><textarea id="reason-text" class="gm-input" required></textarea></div></form>`,btn('ย้อนกลับ','close-dialog')+'<button class="btn danger" type="submit" form="reason-form">ยืนยัน</button>',{kind:'cancel',id:r.id});return}changeStatus(r,next);render();toast(`ย้ายเป็น${STATUS[next]}แล้ว`)});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))});
reducedQuery.addEventListener('change',()=>{animations.forEach(a=>a.finish());animations=[];countFrames.forEach(cancelAnimationFrame);countFrames=[];document.querySelectorAll('[data-count]').forEach(el=>el.textContent=el.dataset.count)});
window.addEventListener('hashchange',()=>{const hash=location.hash.slice(1);if(hash.startsWith('request/'))routeTo('detail',hash.slice(8));else routeTo(hash||'home')});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state.route==='board')render();else placeActionBar()},150)});
const initial=location.hash.slice(1);if(initial.startsWith('request/')){state.route='detail';state.detailId=initial.slice(8)}else if(['home','board','my','repair','dashboard','team','gmcreate'].includes(initial))state.route=initial;
render();

window.GMDemo={getState:()=>state,businessMs,addBusiness,reset:()=>{state=seed();routeTo('home')},setView:(id)=>{state.userId=id;render()},navigate:routeTo,get,activeBudgetUsed};
</script>
